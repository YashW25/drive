# OpenWA - Coolify production deployment
# SQLite + local storage. Redis, PostgreSQL and MinIO disabled.

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: openwa-docker-proxy
    restart: unless-stopped
    networks:
      - internal-docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: '1'
      IMAGES: '1'
      VOLUMES: '1'
      INFO: '1'
      PING: '1'
      POST: '1'
      DELETE: '1'
    labels:
      - 'com.openwa.service=docker-proxy'
      - 'com.openwa.core=true'

  openwa-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped

    networks:
      - openwa-network
      - internal-docker

    # Security hardening
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}

    ports:
      - '127.0.0.1:${API_PORT:-2785}:2785'
    expose:
      - '2785'

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      PORT: '2785'
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # SQLite
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-openwa}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}

      # WhatsApp engine
      ENGINE_TYPE: ${ENGINE_TYPE:-}
      SESSION_DATA_PATH: ${SESSION_DATA_PATH:-/app/data/sessions}
      PUPPETEER_HEADLESS: ${PUPPETEER_HEADLESS:-true}
      PUPPETEER_ARGS: ${PUPPETEER_ARGS:---no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu}
      WWEBJS_WEB_VERSION: ${WWEBJS_WEB_VERSION:-}
      WWEBJS_WEB_VERSION_REMOTE_PATH: ${WWEBJS_WEB_VERSION_REMOTE_PATH:-}
      WWEBJS_AUTH_TIMEOUT_MS: ${WWEBJS_AUTH_TIMEOUT_MS:-}

      # Local storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-openwa}

      # Redis disabled
      REDIS_ENABLED: 'false'
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Webhooks
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10000}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-3}
      WEBHOOK_RETRY_DELAY: ${WEBHOOK_RETRY_DELAY:-5000}

      # Rate limiting
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}

      # Plugins
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-true}
      PLUGINS_DIR: ${PLUGINS_DIR:-/app/data/plugins}

      # Security
      API_MASTER_KEY: ${API_MASTER_KEY:-}

      # Docker orchestration
      DOCKER_HOST: tcp://docker-proxy:2375

    volumes:
      - openwa-data:/app/data
      - ./docker-compose.yml:/app/docker-compose.yml:ro

    depends_on:
      docker-proxy:
        condition: service_started

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    labels:
      - 'com.openwa.service=api'
      - 'com.openwa.core=true'

volumes:
  openwa-data:
    driver: local

networks:
  openwa-network:
    name: openwa-network

  internal-docker:
    name: openwa-internal-docker
    internal: true